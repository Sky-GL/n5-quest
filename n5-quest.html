<title>Ｎ５クエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 単一の世界観（夜のコンソール画面）に振り切る。テーマ切替は持たない */
:root{
  --bg:#07070F; --win:#0F0F1E; --win-2:#161630;
  --fg:#FFFFFF; --dim:#98A0BE; --frame:#FFFFFF;
  --gold:#F8D048; --hp:#E8503E; --mp:#4C86E8; --exp:#5FD86A;
  --ng:#E8503E; --ok:#5FD86A;
  --f:"DotGothic16",'MS Gothic','Osaka-Mono',monospace;
  --px:3px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--f); font-size:16px; line-height:1.75;
  -webkit-font-smoothing:none; text-rendering:optimizeSpeed;
  /* 走査線のかすかな縞 */
  background-image:repeating-linear-gradient(180deg, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
}
.wrap{max-width:560px; margin:0 auto; padding:10px 10px 84px; min-height:100vh}
canvas{image-rendering:pixelated; image-rendering:crisp-edges}
button{font-family:inherit; font-size:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left}
button:focus-visible{outline:var(--px) solid var(--gold); outline-offset:2px}

/* ---- ふりがな ----
   N5では画面に出る漢字すべてにふりがなを振る。ルビは行間を押し広げるので、
   ルビの入りうる要素には必ず余裕のある line-height を持たせている。 */
ruby{ruby-align:center; ruby-position:over}
rt{
  /* N5ではふりがなが本体。小さくしすぎると読めないので、親文字の6割弱まで大きくする */
  font-size:.58em; line-height:1.2; letter-spacing:0;
  color:#CBD2EC; font-weight:normal; user-select:none;
}
.ruby-on{line-height:2.3}

/* ---- ウィンドウ枠 ---- */
.win{
  background:var(--win); border:var(--px) solid var(--frame);
  border-radius:5px; padding:10px 13px; margin-bottom:10px; position:relative;
}
.win.tight{padding:7px 11px}
.win-t{
  position:absolute; top:calc(var(--px) * -1 - 11px); left:12px;
  background:var(--bg); padding:0 7px; font-size:12px; color:var(--gold); letter-spacing:.08em;
}

/* ---- ステータス ---- */
.st{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px; align-items:center}
.st-l{color:var(--dim); font-size:12.5px; letter-spacing:.06em}
.st-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.st-n{color:var(--gold); font-variant-numeric:tabular-nums}
.bar{display:flex; gap:2px; height:9px; flex:1; min-width:70px; max-width:190px}
.bar i{flex:1; background:var(--win-2); border-radius:1px}
.bar i.on{background:var(--c, var(--fg))}
.meters{display:grid; gap:5px}
.meter{display:grid; grid-template-columns:52px 1fr auto; gap:9px; align-items:center; font-size:13px}
.meter .lab{color:var(--dim); font-size:12.5px}
.meter .v{font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--dim); min-width:62px; text-align:right}

/* ---- 敵の舞台 ---- */
.stage{
  /* 学びの窓を読むために下へスクロールしても敵が見えるよう、上端に貼り付ける。
     下部メニュー(.nav, z-index:30)より下に置く */
  position:sticky; top:0; z-index:20;
  border:var(--px) solid var(--frame); border-radius:5px; margin-bottom:10px;
  background:radial-gradient(120% 90% at 50% 100%, #1B1B3A 0%, #0C0C1B 62%, #07070F 100%);
  /* 左下に勇者が立つぶん、敵の列を右へ寄せる。
     place-items:center は padding の内側で効くので、左padding を厚くすると中心が右へずれる */
  min-height:186px; display:grid; place-items:center; gap:8px; padding:16px 12px 13px 62px;
}
.stage::after{ /* 地面のドット線 */
  content:""; position:absolute; left:10%; right:10%; bottom:12px; height:var(--px);
  background:repeating-linear-gradient(90deg, #2E2E58 0 6px, transparent 6px 12px);
}
.mon{position:relative}
/* 被弾: 左右に揺れながら白く点滅する。
   brightness(0)+invert(1) で描画済みピクセルだけが白く飛び、輪郭が光る。
   steps(1,end) で中間補間を切り、ドット絵らしい硬い切り替わりにする。 */
.mon.hit{animation:monHit .5s steps(1,end)}
@keyframes monHit{
  0%  {transform:translateX(-8px); filter:brightness(0) invert(1)}
  12% {transform:translateX( 7px); filter:none}
  24% {transform:translateX(-6px); filter:brightness(0) invert(1)}
  36% {transform:translateX( 6px); filter:none}
  48% {transform:translateX(-4px); filter:brightness(0) invert(1)}
  60% {transform:translateX( 4px); filter:none}
  72% {transform:translateX(-2px); filter:brightness(0) invert(1)}
  84% {transform:translateX( 2px); filter:none}
  100%{transform:translateX(0);    filter:none}
}
/* 撃破: 数回点滅してから消える。.hit より後に置いて animation を上書きする */
.mon.dead{animation:monDie .62s steps(1,end) forwards}
@keyframes monDie{
  0%  {filter:brightness(0) invert(1); opacity:1}
  18% {filter:none;                    opacity:1}
  36% {filter:brightness(0) invert(1); opacity:1}
  54% {filter:none;                    opacity:1}
  72% {filter:brightness(0) invert(1); opacity:.7}
  100%{filter:brightness(0) invert(1); opacity:0; transform:translateY(7px) scale(.88)}
}
.stage-hp{
  position:absolute; top:7px; left:10px; right:10px; z-index:2;
  display:flex; gap:10px; align-items:center; font-size:11.5px; color:var(--dim);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
.stage-hp b{font-weight:normal; color:var(--gold)}
.stage-hp .sh-hp b{color:var(--hp)}
.stage-hp .sh-mp b{color:var(--mp)}
/* 敵の隊列。1〜3体を横に並べ、狙っている相手だけ印を付ける */
.foes{display:flex; align-items:flex-end; justify-content:center; gap:10px}
.foe{display:grid; justify-items:center; gap:4px; position:relative}
.foe.gone{visibility:hidden}
/* 狙っている相手は、下の金の線と大きめのHPで示す。
   舞台の上端にはHP/MPの行があるので、印を上に出すと重なる */
.foe:not(.tgt) canvas{opacity:.72}
/* ぬし・大ボスは、ふつうの敵と同じ大きさだと「区切り」に見えない */
.foe.boss canvas{filter:drop-shadow(0 0 7px rgba(248,208,72,.55))}
.foe .aim{width:62%; height:3px; border-radius:1px; background:transparent}
.foe.tgt .aim{background:var(--gold)}
.foe .mon-hp i{width:8px; height:8px}
.foe.tgt .mon-hp i{width:11px; height:11px}
.mon-name{font-size:13.5px; color:var(--dim); letter-spacing:.1em}
.mon-hp{display:flex; gap:3px}
.mon-hp i{width:11px; height:11px; background:var(--win-2); border:1px solid #35356A; border-radius:1px}
.mon-hp i.on{background:var(--hp); border-color:var(--hp)}
.dmg{
  position:absolute; left:50%; top:16%; transform:translateX(-50%);
  font-size:26px; color:var(--gold); pointer-events:none; animation:fly .7s ease-out forwards;
  text-shadow:2px 2px 0 #000;
}
.dmg.miss{color:var(--ng)}
@keyframes fly{0%{opacity:0; transform:translate(-50%,10px)}25%{opacity:1}100%{opacity:0; transform:translate(-50%,-34px)}}
.stage.flash{animation:flash .18s steps(2) 2}
@keyframes flash{50%{background:#4A1414}}

/* 戦闘画面の勇者。敵は中央、勇者は左下。絶対配置にして
   敵の名前やHPの並び(grid)を押し出さないようにしている。
   攻撃中は踏み込み(このアニメ)と同時に、絵そのものを剣を振り上げた px2 に差し替える。 */
.hero-sprite{position:absolute; left:12px; bottom:11px; z-index:1}
.hero-sprite.atk{animation:heroAtk .36s steps(1,end)}
@keyframes heroAtk{
  0%  {transform:translate(0,0)}
  22% {transform:translate(18px,-6px)}
  44% {transform:translate(33px,0)}
  68% {transform:translate(14px,0)}
  100%{transform:translate(0,0)}
}
.hero-sprite.hurt{animation:heroHurt .45s steps(1,end)}
@keyframes heroHurt{
  0%  {transform:translateX(0);    filter:brightness(0) invert(1)}
  15% {transform:translateX(-5px); filter:none}
  30% {transform:translateX( 4px); filter:brightness(0) invert(1)}
  45% {transform:translateX(-4px); filter:none}
  60% {transform:translateX( 3px); filter:brightness(0) invert(1)}
  75% {transform:translateX(-2px); filter:none}
  100%{transform:translateX(0);    filter:none}
}
.hero-sprite.fallen{filter:grayscale(1) brightness(.55); transform:rotate(-12deg) translateY(4px)}

/* ---- メッセージ ---- */
.msg{min-height:4.9em; font-size:15.5px; line-height:1.85; white-space:pre-wrap; word-break:break-word}
.msg .q{color:var(--gold)}
/* メッセージが出終わった印。押せる場所(▶)と紛れないよう点滅させない */
.cursor-wait::after{content:"▼"; color:#4E5480; margin-left:6px; font-size:11px; vertical-align:2px}
.qword{
  font-size:30px; line-height:1.4; color:var(--gold); letter-spacing:.06em;
  display:block; margin:8px 0 2px;
}
.qword.sm{font-size:21px}
.qword .qread{
  display:block; font-size:13px; color:var(--dim); letter-spacing:.14em;
  margin-top:2px; line-height:1.5;
}
.qword.en{font-size:22px; color:#DDE2F2; letter-spacing:.02em}
.qsent{font-size:16.5px; line-height:2.5; display:block; margin:4px 0}
.blank{color:var(--gold); border-bottom:var(--px) solid var(--gold); padding:0 1.1em}

/* ---- コマンド窓 ---- */
.cmds{display:grid; gap:1px}
.cmd{
  display:grid; grid-template-columns:20px 1fr; gap:6px; align-items:start;
  padding:9px 6px; border-radius:3px; font-size:15.5px; line-height:1.9;
}
.cmd .cur{color:var(--gold)}
.cmd:disabled .cur{color:#3A3F5E}
.cmd:hover:not(:disabled){background:var(--win-2)}
/* タッチでも押した手応えが出るようにする */
.cmd:active:not(:disabled){background:var(--win-2); transform:translateX(2px)}
.cmd:disabled{cursor:default}
.cmd.ok{background:#12341C; color:var(--ok)}
.cmd.ok .cur{color:var(--ok)}
.cmd.ng{background:#3A1512; color:var(--ng)}
.cmd.ng .cur{color:var(--ng)}
.cmd.gone{opacity:.28; text-decoration:line-through}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row .cmd{flex:1; min-width:116px; grid-template-columns:16px 1fr}

/* ---- 学習の窓 ---- */
.learn{font-size:14px; line-height:2.1; display:grid; gap:7px}
.learn dl{display:grid; grid-template-columns:62px 1fr; gap:5px 10px; margin:0}
.learn dt{color:var(--dim); font-size:12.5px; line-height:1.9}
.learn dd{margin:0}
.learn b{color:var(--gold); font-weight:normal}
.learn .ex{border-left:var(--px) solid var(--gold); padding:6px 0 6px 11px; color:#DDE2F2; font-size:15px; line-height:2.6}
.learn .en{color:var(--dim); font-size:13px}
.ai{margin-top:4px; padding:9px 11px; background:var(--win-2); border-radius:3px; font-size:13.5px; line-height:2; white-space:pre-wrap}
.ai.err{color:var(--ng)}

/* ---- 図鑑 ---- */
.tabs{display:flex; gap:7px; margin-bottom:10px}
.tabs button{padding:4px 12px; border:var(--px) solid #3A3A6E; border-radius:4px; font-size:13.5px; color:var(--dim)}
.tabs button[aria-pressed="true"]{border-color:var(--gold); color:var(--gold); background:var(--win-2)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(13px,1fr)); gap:3px; margin:6px 0 10px}
.tile{aspect-ratio:1; border-radius:1px; background:var(--win-2); border:1px solid #2A2A52}
.tile.s1{background:#2E2E58; border-color:#3A3A6E}
.tile.s2{background:#3C5A8E; border-color:#4C86E8}
.tile.s3{background:#4C86E8; border-color:#78A8F0}
.tile.s4{background:#3E9E58; border-color:#5FD86A}
.tile.s5{background:#5FD86A; border-color:#9CF0A4}
.tile.s6{background:var(--gold); border-color:#FFF0A0}
/* ---- 50音表 ---- */
/* 覚えた字が表の中で埋まっていく。ID順のフラットな格子だと、
   学習者が「あかさたな のどこにいるか」を掴めない */
.kchart{display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin:6px 0 4px}
.kc{
  aspect-ratio:1; display:grid; place-items:center; align-content:center;
  border-radius:3px; background:var(--win-2); border:1px solid #2A2A52;
}
.kc b{font-weight:normal; font-size:clamp(14px,4.6vw,19px); line-height:1.1}
.kc i{font-style:normal; font-size:clamp(8px,2.6vw,11px); color:var(--dim); line-height:1.3}
.kc.s1{background:#2E2E58; border-color:#3A3A6E}
.kc.s2{background:#3C5A8E; border-color:#4C86E8}
.kc.s3{background:#4C86E8; border-color:#78A8F0}
.kc.s4{background:#3E9E58; border-color:#5FD86A}
.kc.s5{background:#5FD86A; border-color:#9CF0A4}
.kc.s6{background:var(--gold); border-color:#FFF0A0}
.kc.s3 i,.kc.s4 i{color:#E4E9FA}
.kc.s5 b,.kc.s5 i,.kc.s6 b,.kc.s6 i{color:#0F0F1E}
.kc.gap{background:transparent; border-color:transparent}
.kc.none{opacity:.25}
.ktitle{font-size:12.5px; color:var(--dim); margin-top:10px}
.leg{display:flex; gap:11px; flex-wrap:wrap; font-size:11.5px; color:var(--dim)}
.leg span{display:flex; align-items:center; gap:4px}
.leg .tile{width:11px; aspect-ratio:auto; height:11px}
.entries{display:grid; gap:1px}
.entry{display:grid; grid-template-columns:5px 1fr auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid #1E1E3C}
.entry .pip{width:5px; height:30px; border-radius:1px}
.entry .w{font-size:16px}
.entry .r{font-size:12px; color:var(--dim)}
.entry .m{font-size:13px; color:#C6CCE4; line-height:1.9}
.entry .lv{font-size:11.5px; color:var(--dim); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.zroster{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:9px}
.zcard{border:var(--px) solid #3A3A6E; border-radius:4px; padding:8px 5px; text-align:center; display:grid; gap:5px; justify-items:center}
.zcard.seen{border-color:var(--gold)}
.zcard .zn{font-size:11px; color:var(--dim); line-height:1.4}
.zcard.seen .zn{color:var(--fg)}
.zcard .zc{font-size:10.5px; color:var(--gold); font-variant-numeric:tabular-nums}
.zcard .zd{font-size:10.5px; color:var(--dim); line-height:1.55; text-align:left}
.zcard canvas{opacity:.22}
.zcard.seen canvas{opacity:1}

/* ---- 設定 ---- */
.fld{display:grid; gap:5px; margin-bottom:13px}
.fld label{font-size:12.5px; color:var(--dim)}
.fld input{
  font-family:inherit; font-size:15px; padding:7px 10px; color:var(--fg);
  background:var(--win-2); border:var(--px) solid #3A3A6E; border-radius:3px; width:100%;
}
.tg{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #1E1E3C; font-size:14.5px}
.tg:last-child{border-bottom:none}
.tg b{color:var(--gold); font-weight:normal; font-size:13.5px}

/* ---- タイトル画面 ---- */
/* 紋章。タイトル文字の後ろに敷く。
   金一色だと「枠」にしか見えなかったので、青と紅で四分割した色付きにしてある。
   文字は前面(z-index:1)＋濃い影で、重なっても読めるようにする。 */
.crest{
  /* 絶対配置にすると画面の上で切れるので、ふつうの流れに置いたまま
     下マージンを負にして、タイトル文字を盾の下のほうに重ねる。
     こうすると縦の中央ぞろえが紋章の高さも数に入れてくれる */
  display:block; margin:0 auto -34px; position:relative;
  z-index:0; opacity:.92; pointer-events:none;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.65));
  animation:crestBreathe 7s steps(3,end) infinite;
}
@keyframes crestBreathe{0%,100%{opacity:.86}50%{opacity:1}}
/* 紋章とロゴの後ろのほのかな光。奥行きを出して、上の余白を締める */
.title-glow{
  position:absolute; left:50%; top:30%; width:min(88vw,430px); aspect-ratio:1;
  transform:translate(-50%,-50%); pointer-events:none; z-index:0;
  background:radial-gradient(circle, rgba(248,208,72,.11) 0%, rgba(248,208,72,.04) 36%, transparent 66%);
}
.title{
  position:relative; min-height:calc(100vh - 24px); overflow:hidden;
  display:grid; align-content:center; justify-items:center; gap:22px; padding:24px 10px;
}
.stars{position:absolute; inset:0; pointer-events:none}
.stars i{
  position:absolute; width:2px; height:2px; background:#fff; border-radius:0;
  animation:tw 3.2s steps(2,end) infinite;
}
@keyframes tw{0%,100%{opacity:.14}50%{opacity:.85}}
.title-hero,.title-menu,.title-save{position:relative; z-index:1}
.title-logo{text-align:center; position:relative}
.title-main,.title-sub{position:relative; z-index:1}
.title-main{
  font-size:clamp(34px,11vw,54px); color:var(--gold); letter-spacing:.1em; line-height:1.25;
  /* 紋章の上に重なるので、影を厚くして輪郭を立たせる */
  text-shadow:3px 3px 0 #6B4A00, 6px 6px 0 #000, 0 0 12px rgba(0,0,0,.85);
}
.title-sub{
  display:inline-block; margin-top:12px; padding:11px 10px 0; font-size:12.5px;
  color:#C6CCE4; letter-spacing:.36em; border-top:var(--px) solid #2E2E58;
  text-shadow:0 2px 5px #000, 0 0 10px #000;
}
/* 英語のときのロゴ。ドラクエの海外版は「DRAGON」が小さく上、「QUEST」が
   大きく下という組み方なので、それをなぞる */
.title-main.en{
  display:flex; flex-direction:column; align-items:center;
  line-height:1; letter-spacing:.12em;
}
.title-main.en .tl-sm{
  font-size:.5em; letter-spacing:.46em; margin-left:.46em; margin-bottom:.1em;
  /* 紋章の濃い中央に重なる位置なので、下段より影を強くしないと沈む */
  color:#FFD66B; text-shadow:2px 2px 0 #6B4A00, 4px 4px 0 #000, 0 0 14px #000;
}
/* 英語は字数が多いので、字間をつめないと携帯で折り返す */
.title-sub.en{letter-spacing:.13em; font-size:11.5px}
.title-ja{
  margin-top:6px; font-size:10.5px; color:#7F87AB; letter-spacing:.22em;
  text-shadow:0 2px 4px #000;
}
.title-hero{position:relative; display:grid; place-items:center}
.title-hero canvas{animation:bob 2.6s steps(2,end) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* 最初の画面の言語えらび。ぼうけんのしょを選ぶ前に要るので、
   書の中ではなく端末に持たせる（n5quest:uien） */
.langpick{
  position:relative; z-index:1; display:flex; gap:8px; justify-content:center;
  margin-top:-8px;
}
.langpick .hp-b{min-width:88px; font-size:14px; padding:5px 12px}
.heropick{display:flex; align-items:center; gap:8px; margin-top:5px; padding:7px 5px 1px; border-top:1px solid #23234A}
.hp-l{font-size:12.5px; color:var(--dim); margin-right:auto}
.hp-b{
  min-width:44px; text-align:center; padding:3px 10px; font-size:15px; color:var(--dim);
  border:var(--px) solid #3A3A6E; border-radius:4px;
}
.hp-b[aria-pressed="true"]{color:var(--gold); border-color:var(--gold); background:var(--win-2)}
.slot-no{
  display:inline-grid; place-items:center; width:20px; height:20px; margin-right:8px;
  border:1px solid #3A3A6E; border-radius:3px; font-size:12px; color:var(--gold); vertical-align:1px;
}
.slot-empty{color:#5A6088}
.title-menu{min-width:216px; margin:0; position:relative}
.title-menu .cmd{font-size:17px; padding:9px 6px}
.title-save{font-size:11.5px; color:var(--dim); letter-spacing:.06em; text-align:center; position:relative}

/* ---- 下部メニュー ---- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg);
  border-top:var(--px) solid var(--frame); padding:5px 0 max(5px, env(safe-area-inset-bottom));
}
.nav-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}

<script>// かな → ローマ字。
// 「日本語が完全に初めて」の人は、かなも読みの選択肢も読めない。
// ローマ字はデータに持たず、ここで実行時に変換する（805語の読みにもそのまま効く）。
//
// このファイルはビルド時に data.js へそのまま埋め込まれ、アプリからも
// build.mjs の検証からも同じ実装が使われる。二重に持たないための作り。
const KANA_BASE = {
  'あ':'a','い':'i','う':'u','え':'e','お':'o',
  'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
  'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
  'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
  'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
  'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
  'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
  'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
  'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
  'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
  'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
  'や':'ya','ゆ':'yu','よ':'yo',
  'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
  'わ':'wa','ゐ':'i','ゑ':'e','を':'o',
  'ゔ':'vu'
};
const SMALL_Y = { 'ゃ':'ya', 'ゅ':'yu', 'ょ':'yo' };
const SMALL_V = { 'ぁ':'a', 'ぃ':'i', 'ぅ':'u', 'ぇ':'e', 'ぉ':'o' };

// カタカナはコードポイントをずらすだけでひらがなに重なる
function toHira(ch) {
  const c = ch.charCodeAt(0);
  return (c >= 0x30A1 && c <= 0x30F6) ? String.fromCharCode(c - 0x60) : ch;
}

function toRomaji(s) {
  const t = [...String(s || '')];
  const out = [];
  for (let i = 0; i < t.length; i++) {
    const ch = toHira(t[i]);
    const nx = toHira(t[i + 1] || '');
    const base = KANA_BASE[ch];

    // 拗音（きゃ・しゅ・ちょ …）
    if (base && SMALL_Y[nx]) {
      const y = SMALL_Y[nx];
      if (base === 'shi') out.push('sh' + y[1]);
      else if (base === 'chi') out.push('ch' + y[1]);
      else if (base === 'ji') out.push('j' + y[1]);
      else out.push(base.slice(0, -1) + y);
      i++;
      continue;
    }
    // 外来語の小さい母音（ファ・ティ・ウィ …）
    if (base && SMALL_V[nx]) {
      const v = SMALL_V[nx];
      if (ch === 'う') out.push('w' + v);
      else if (base.length === 1) out.push(base === v ? v : base + v);
      else out.push(base.slice(0, -1) + v);
      i++;
      continue;
    }
    // 促音（っ）は次の子音を重ねる。「っち」は tchi
    if (ch === 'っ') {
      const b2 = KANA_BASE[toHira(t[i + 1] || '')] || '';
      if (b2) out.push(b2[0] === 'c' ? 't' : b2[0]);
      continue;
    }
    // 長音（ー）は直前の母音をのばす
    if (ch === 'ー') {
      const prev = out[out.length - 1] || '';
      const v = prev.slice(-1);
      if ('aiueo'.indexOf(v) >= 0) out.push(v);
      continue;
    }
    // ん。母音と y の前は n' にして「きんいろ→kin'iro」の読み違いを防ぐ
    if (ch === 'ん') {
      const b2 = KANA_BASE[toHira(t[i + 1] || '')] || '';
      out.push(/^[aiueoy]/.test(b2) ? "n'" : 'n');
      continue;
    }
    out.push(base !== undefined ? base : t[i]);
  }
  return out.join('');
}

const CONFUSE={"さ":["ち","き","ざ"],"ち":["さ","き","ぢ"],"き":["さ","ち","ぎ"],"ね":["れ","わ","を"],"れ":["ね","わ","を"],"わ":["ね","れ","を"],"を":["ね","れ","わ"],"る":["ろ"],"ろ":["る"],"ぬ":["め"],"め":["ぬ","あ","お","の"],"は":["ほ","ま","け","ば","ぱ"],"ほ":["は","ま","ぼ","ぽ"],"ま":["は","ほ","よ"],"い":["り","こ"],"り":["い","こ"],"こ":["い","り","に","ご"],"く":["へ","ぐ"],"へ":["く","べ","ぺ"],"つ":["う","ら","し","づ"],"う":["つ","ら"],"ら":["つ","う","ふ"],"し":["つ","じ"],"た":["な","だ"],"な":["た"],"に":["こ"],"す":["む","ず"],"む":["す"],"そ":["ん","ぞ"],"ん":["そ"],"あ":["お","め"],"お":["あ","め"],"け":["は","げ"],"よ":["ま"],"の":["め"],"ふ":["ら","ぶ","ぷ"],"シ":["ツ","ミ","ジ"],"ツ":["シ","ミ"],"ミ":["シ","ツ"],"ソ":["ン","ノ","ゾ"],"ン":["ソ","ノ"],"ノ":["ソ","ン"],"ク":["タ","ワ","グ"],"タ":["ク","ワ","ダ"],"ワ":["ク","タ","フ","ウ"],"ス":["ヌ","ズ"],"ヌ":["ス"],"チ":["テ"],"テ":["チ","デ"],"ナ":["メ"],"メ":["ナ"],"フ":["ワ","ウ","ブ","プ"],"ウ":["フ","ワ"],"マ":["ア"],"ア":["マ"],"ル":["レ"],"レ":["ル"],"コ":["ユ","ゴ"],"ユ":["コ"],"ケ":["セ","ゲ"],"セ":["ケ","サ","ゼ"],"ハ":["ヘ","バ","パ"],"ヘ":["ハ","ベ","ペ"],"ロ":["ヨ"],"ヨ":["ロ"],"サ":["セ","ザ"],"ニ":["エ"],"エ":["ニ"],"ト":["ヒ","ド"],"ヒ":["ト","ビ","ピ"],"か":["が"],"が":["か"],"カ":["ガ"],"ガ":["カ"],"ぎ":["き"],"キ":["ギ"],"ギ":["キ"],"ぐ":["く"],"グ":["ク"],"げ":["け"],"ゲ":["ケ"],"ご":["こ"],"ゴ":["コ"],"ざ":["さ"],"ザ":["サ"],"じ":["し"],"ジ":["シ"],"ず":["す"],"ズ":["ス"],"せ":["ぜ"],"ぜ":["せ"],"ゼ":["セ"],"ぞ":["そ"],"ゾ":["ソ"],"だ":["た"],"ダ":["タ"],"ぢ":["ち"],"づ":["つ"],"て":["で"],"で":["て"],"デ":["テ"],"と":["ど"],"ど":["と"],"ド":["ト"],"ば":["は","ぱ"],"ぱ":["は","ば"],"バ":["ハ","パ"],"パ":["ハ","バ"],"ひ":["び","ぴ"],"び":["ひ","ぴ"],"ぴ":["ひ","び"],"ビ":["ヒ","ピ"],"ピ":["ヒ","ビ"],"ぶ":["ふ","ぷ"],"ぷ":["ふ","ぶ"],"ブ":["フ","プ"],"プ":["フ","ブ"],"べ":["へ","ぺ"],"ぺ":["へ","べ"],"ベ":["ヘ","ペ"],"ペ":["ヘ","ベ"],"ぼ":["ほ","ぽ"],"ぽ":["ほ","ぼ"],"ホ":["ボ","ポ"],"ボ":["ホ","ポ"],"ポ":["ホ","ボ"]};</script>
<script>
(function(){
"use strict";
const $ = (s,r)=>(r||document).querySelector(s);
const DAY = 86400000;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick = a=>a[Math.random()*a.length|0];

/* ===== ふりがな =====
   データ側は [漢字|よみ] と書く。ここで <ruby> に開く。
   N5では画面に出る漢字にふりがなが無いと読めないので、
   日本語を出す経路はすべて rb() を通す。 */
const RUBY=/\[([^\[\]|]+)\|([^\[\]|]+)\]/g;
function rb(s){
  let out='', last=0, m;
  RUBY.lastIndex=0;
  while((m=RUBY.exec(s))){
    out+=esc(s.slice(last,m.index))+'<ruby>'+esc(m[1])+'<rt>'+esc(m[2])+'</rt></ruby>';
    last=m.index+m[0].length;
  }
  return out+esc(s.slice(last));
}
// ルビ記法を外した素の文（読み上げや比較に使う）
const bare = s => String(s).replace(RUBY,'$1');
// 例文の 【…】 は出題の対象語。学びの窓では強調、穴埋めでは空欄にする
const MARK=/【[^】]*】/;
const MARK_G=/【[^【】]*】/g;
const exHtml = s => rbFade(s).replace(/【/g,'<b>').replace(/】/g,'</b>');
const blankHtml = s => rbFade(String(s).replace(MARK_G,'')).replace(//g,'<span class="blank"> </span>');

/* ===== 出題項目 ===== */
const ITEMS=[];
// かなは「1字」が1項目。例語は読みの練習台として持たせる
DATA.kana.forEach(k=>ITEMS.push({
  id:'n:'+k[0], sec:'kana', w:k[0], read:k[1], romaji:k[1],
  ex:k[2], exr:k[3], en:k[4], mean:`${k[2]}（${k[3]}）${k[4]}`,
  kata:/[ァ-ヺ]/.test(k[0])
}));
DATA.vocab.forEach(v=>ITEMS.push({id:'v:'+v[0],sec:'vocab',w:v[0],read:v[1],pos:v[2],mean:v[3],en:v[4],ex:v[5]}));
// 漢字は「1字」を1項目にする。例語をそのまま項目にすると、
// 食べる・電話のような中心的な語が「ことば」側と二重に登録されてしまうため。
DATA.kanji.forEach(k=>ITEMS.push({
  id:'k:'+k[0],sec:'kanji',w:k[0],read:(k[2]||k[1]),mean:k[3],en:k[4],
  on:k[1],kun:k[2],words:k[5]||[]}));
DATA.grammar.forEach(g=>ITEMS.push({id:'g:'+g[0],sec:'grammar',w:g[0],read:'',conn:g[1],mean:g[2],en:g[3],ex:g[4],note:g[5]}));
const BY_ID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const BY_SEC={kana:[],vocab:[],kanji:[],grammar:[]};
ITEMS.forEach(i=>BY_SEC[i.sec].push(i));
const SEC={kana:'かなの いずみ',vocab:'ことばの もり',kanji:'かんじの いせき',grammar:'ぶんぽうの とう'};
const SEC_SHORT={kana:'かな',vocab:'ことば',kanji:'かんじ',grammar:'ぶんぽう'};
const SEC_EN={kana:'Kana Spring',vocab:'Word Forest',kanji:'Kanji Ruins',grammar:'Grammar Tower'};
// かなは JLPT の出題範囲ではなく その手前の準備。点数の見積もりからは外す
const JLPT_SECS=['vocab','kanji','grammar'];
// UIに添える英語。出し分けは body のクラスでまとめて行う（静的なナビにも効かせるため）
const gl = t => `<span class="gl">${esc(t)}</span>`;

/* ===== 状態 ===== */
const INTERVALS=[0,1,2,4,9,20,45], MAX_LV=6;
const expToNext = lv => 100 + (lv-1)*60;
const DEFAULT={
  lv:1, exp:0, hp:20, maxHp:20, mp:5, maxMp:5, gold:0,
  streak:0, lastDay:'', lastStudyDay:'', doneToday:0,
  examDate:'2026-12-06', newPerDay:12, showEn:true, uiEn:true, romaji:false, romajiFaded:0, fadeRuby:true, sound:true, speech:true, hero:'hero_m',
  name:'', srs:{}, defeated:{}, best:0, listenOk:0, listenN:0,
  chap:{}, charm:0, bought:{}, robe:'', marks:{}, bonusDay:'', dayGoal:0, goalDay:'', knowsKana:null, updatedAt:0
};
// ぼうけんのしょは3つ。1つを1人ぶんの進捗と設定にあてる
const SLOTS=[1,2,3];
const KEY=n=>'n5quest:s'+n, LAST='n5quest:last';
let SLOT=1, db=null, sample=null, saveTimer=null, touched=false;

// プライベートモードや file:// では localStorage 自体が例外を投げる。
// 読み書きは必ずこの2つを通し、使えない環境でもゲームが動くようにする。
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function readSlot(n){
  try{ const raw=lsGet(KEY(n)); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function writeSlot(n,data){ lsSet(KEY(n),JSON.stringify(data)); }
// 使用中か。名前があるか、少しでも進めていれば使用中とみなす
function slotUsed(n){
  const d=readSlot(n);
  return !!(d && (d.name || d.exp>0 || d.lv>1 || Object.keys(d.srs||{}).length));
}
// 画面の英語は「その端末を使う人の読める言語」なので、書(S)ではなく端末に持つ。
// ぼうけんのしょを選ぶ前のタイトル画面でも必要になるため
const UIEN_KEY='n5quest:uien';
const uiEnPref = () => { const v=lsGet(UIEN_KEY); return v===null?true:v==='1'; };
function setUiEnPref(on){ lsSet(UIEN_KEY,on?'1':'0'); S.uiEn=on; if(S.name) writeSlot(SLOT,S); }
function normalize(s){
  const fresh=!s;
  s=Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),s||{});
  if(fresh) s.uiEn=uiEnPref();     // 新しい書は端末の言語えらびを引き継ぐ
  s.hp=Math.max(0,Math.min(s.hp,s.maxHp)); s.mp=Math.max(0,Math.min(s.mp,s.maxMp));
  return s;
}
let S=normalize(readSlot(Number(lsGet(LAST))||1));
function useSlot(n){
  SLOT=n; S=normalize(readSlot(n));
  lsSet(LAST,String(n));
}
SLOT=Number(lsGet(LAST))||1;

function persist(){
  S.updatedAt=Date.now();
  writeSlot(SLOT,S);
  if(db){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
    db.doc('progress/slot'+SLOT).set(JSON.parse(JSON.stringify(S))).catch(()=>{});
  },1200); }
}
const dayKeyOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function todayKey(){ return dayKeyOf(new Date()); }
function shiftKey(n){ const d=new Date(); d.setDate(d.getDate()+n); return dayKeyOf(d); }
const dayGap=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/DAY);
// 連続日数の しるし。ここに届くと ごほうびが出る
const MARKS=[3,7,14,30,60,100];
function rollDay(){
  const t=todayKey();
  let changed=false;
  if(S.lastDay!==t){ S.lastDay=t; S.doneToday=0; changed=true; }
  if(S.lastStudyDay && S.lastStudyDay!==t){
    const gap=dayGap(S.lastStudyDay,t);
    if(gap>1){
      const miss=gap-1;
      if(S.charm>=miss){
        // 休んだ日を ふだ で埋める。lastStudyDay を昨日に進めるので、この分岐は一度しか通らない
        S.charm-=miss; S.lastStudyDay=shiftKey(-1);
      }else{
        S.charm=0; S.streak=0;
      }
      changed=true;
    }
  }
  if(!S.lastStudyDay && S.streak){ S.streak=0; changed=true; }
  // 今日の目標は朝いちで決めて動かさない。解くたびに目標が縮むと進みが読めない。
  // 「今日ぶんは計算済み」を日付で覚える。0件の日に毎回計算し直さないため
  if(S.goalDay!==t){ S.goalDay=t; S.dayGoal=quota().total; changed=true; }
  // ふだを消費した／連続が切れたのに保存しないと、次に開いたとき数字が食い違う。
  // ただし persist() は使わない。開いただけで updatedAt が進むと、
  // 別の端末で進めた新しい書をクラウドから拾えなくなる。ここは手元に書くだけにする。
  // まだ名前のない書には勝手に書き込まない。
  if(changed && S.name) writeSlot(SLOT,S);
}
// 連続が のびて しるし に届いたら、その数字を返す（ごほうびの表示に使う）
function markStudied(){
  const t=todayKey();
  if(S.lastStudyDay===t) return 0;
  S.streak=(S.lastStudyDay && dayGap(S.lastStudyDay,t)===1)?S.streak+1:1;
  S.lastStudyDay=t;
  const hit=MARKS.find(n=>n===S.streak && !S.marks[n]);
  if(hit){ S.marks[hit]=1; S.gold+=hit*10; return hit; }
  return 0;
}

/* ===== SRS ===== */
const rec=id=>S.srs[id]||{lv:0,due:0,seen:0,miss:0};
const isDue=id=>{const r=S.srs[id];return r&&r.lv>0&&r.due<=Date.now();};
const isNew=id=>!S.srs[id];
function grade(id,ok){
  const r=Object.assign({lv:0,due:0,seen:0,miss:0},S.srs[id]);
  r.seen++;
  if(ok) r.lv=Math.min(MAX_LV,r.lv+1); else { r.miss++; r.lv=Math.max(1,r.lv-2); }
  r.due=ok?Date.now()+INTERVALS[r.lv]*DAY:Date.now()+6*60000;
  S.srs[id]=r; return r;
}
function stats(sec){
  const pool=!sec?ITEMS:(Array.isArray(sec)?sec.reduce((a,x)=>a.concat(BY_SEC[x]),[]):BY_SEC[sec]);
  let done=0,sum=0,due=0,fresh=0; const dist=[0,0,0,0,0,0,0];
  pool.forEach(i=>{const r=rec(i.id); dist[r.lv]++; sum+=r.lv;
    if(r.lv>=4)done++; if(isDue(i.id))due++; if(isNew(i.id))fresh++;});
  return {n:pool.length,done,due,fresh,dist,rate:sum/(pool.length*MAX_LV)};
}
/* ===== 支援を薄める =====
   ゼロからN5合格までを通す前提。本番は100%日本語なので、
   ローマ字・英語・ふりがなは最後まで出しっぱなしにはできない。
   薄める基準は章や日数ではなく「その人がその項目をどれだけ知っているか」。
   章で切ると遅い人には早すぎ、速い人には遅すぎる。 */
const FADE={ en:4, ruby:4 };          // ★いくつで支援を下げるか
const KANA_DONE=0.8;                  // かながこれだけ進んだらローマ字を外す

// ローマ字だけは、語の難しさではなく「その人のかなの習熟」で決まる。
// かなが読めるのにローマ字が出ていると、いつまでもかなを見ないため。
function fadeRomaji(){
  if(!S.romaji || S.romajiFaded) return 0;
  if(stats('kana').rate < KANA_DONE) return 0;
  S.romaji=0; S.romajiFaded=1;
  return 1;
}
// 英語は消さない。消すと「読めるが意味が分からない」で詰む。
// 覚えた項目だけ、ひと手間おいて出す
function enBlock(it,text){
  if(!S.showEn||!text) return '';
  if(rec(it.id).lv<FADE.en) return `<br><span class="en">${esc(text)}</span>`;
  return `<details class="enfold"><summary>えいご${gl('English')}</summary><span class="en">${esc(text)}</span></details>`;
}
// 覚えた漢字はふりがなを外す。本番の文字・語彙はふりがな無しで読ませるので、
// 出しっぱなしだと「ふりがなが無いと読めない」まま試験に行くことになる
function rbFade(s){
  if(!S.fadeRuby) return rb(s);
  let out='', last=0, m;
  RUBY.lastIndex=0;
  while((m=RUBY.exec(s))){
    out+=esc(s.slice(last,m.index));
    const base=m[1];
    const known = base.length===1 && BY_ID['k:'+base] && rec('k:'+base).lv>=FADE.ruby;
    out += known ? esc(base) : '<ruby>'+esc(base)+'<rt>'+esc(m[2])+'</rt></ruby>';
    last=m.index+m[0].length;
  }
  return out+esc(s.slice(last));
}

/* ===== ホーム画面への案内 =====
   iOSのSafariには「7日さわらないとスクリプトの保存領域を消す」規則がある。
   ふつうにブラウザで開いているだけだと、1週間あけた人の進捗が飛びうる。
   ホーム画面のアプリとして開いていれば対象外になるので、そこだけ案内する。
   Androidにこの規則は無いので出さない。 */
function isIOS(ua,platform,touch){
  // iPadOS 13以降は自分を Mac と名乗るので、タッチの数で見分ける
  return /iPad|iPhone|iPod/.test(ua) || (platform==='MacIntel' && touch>1);
}
const HOME_KEY='n5quest:nohome';
function isStandalone(){
  return window.navigator.standalone===true ||
         !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function needHomeHint(){
  if(lsGet(HOME_KEY)) return false;
  return isIOS(navigator.userAgent,navigator.platform,navigator.maxTouchPoints) && !isStandalone();
}

/* ===== 章（ステージ） =====
   996項目を一本道で見せると、1週間やっても「ぜんたい 3％」にしかならない。
   12の章に切って、8日前後で1つ終わる区切りを作る。 */
const CHAP_OPEN=0.8;   // 章ボスに挑めるようになる到達率
CHAPTERS.forEach(c=>{ c.set=new Set(c.ids); });
const chapCleared = c => !!(S.chap[c.id]&&S.chap[c.id].cleared);
function chapStats(c){
  let done=0,seen=0;
  c.ids.forEach(id=>{ const r=rec(id); if(r.lv>=4)done++; if(r.seen)seen++; });
  return {n:c.ids.length,done,seen,rate:c.ids.length?done/c.ids.length:0};
}
// いま取り組んでいる章＝まだクリアしていない最初の章
function currentChapter(){ return CHAPTERS.find(c=>!chapCleared(c))||CHAPTERS[CHAPTERS.length-1]; }
const chapNo = c => CHAPTERS.indexOf(c)+1;
const chapClearedCount = () => CHAPTERS.filter(chapCleared).length;

/* ===== どうぐや =====
   ゴールドは倒すたびに増えるのに使い道が無いと、ただの数字になってしまう。
   「連続を守る」「少し強くなる」「見た目が変わる」の3方向だけ用意する。 */
const SHOP=[
  {id:'charm',   price:50,  max:9,  name:'まもりの ふだ',     en:'Streak Charm',
   desc:'1にち やすんでも「れんぞく」が きえない。やすんだ ぶんだけ つかう。'},
  {id:'hpStone', price:120, max:12, name:'いのちの いし',     en:'Life Stone',
   desc:'さいだいＨＰが 5 ふえる。'},
  {id:'mpStone', price:90,  max:8,  name:'こころの いし',     en:'Spirit Stone',
   desc:'さいだいＭＰが 1 ふえる。スキャンが おおく つかえる。'},
  {id:'robe_g',  price:400, max:1,  name:'きんの ころも',     en:'Golden Robe',
   desc:'ゆうしゃの ふくが きんいろに なる。'},
  {id:'robe_v',  price:400, max:1,  name:'むらさきの ころも', en:'Violet Robe',
   desc:'ゆうしゃの ふくが むらさきに なる。'}
];

function daysLeft(){ return S.examDate?Math.ceil((new Date(S.examDate+'T09:00:00')-Date.now())/DAY):null; }
function quota(){
  const st=stats(), d=daysLeft();
  const runway=Math.max(1,(d==null?90:d-14));
  const need=Math.min(S.newPerDay,Math.max(4,Math.ceil(st.fresh/runway)));
  return {review:st.due, fresh:st.fresh>0?need:0, total:st.due+(st.fresh>0?need:0)};
}

let AC=null;
function tone(f,dur,when,vol,type){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+(when||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(vol||0.05,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
const SFX={
  hit:()=>{tone(740,.07,0,.05);tone(1050,.09,.06,.05);},
  miss:()=>{tone(200,.13,0,.06,'sawtooth');tone(130,.2,.1,.06,'sawtooth');},
  down:()=>{tone(520,.08,0,.05);tone(390,.08,.07,.05);tone(260,.22,.14,.05);},
  up:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.13,i*.1,.055));},
  win:()=>{[659,659,659,880].forEach((f,i)=>tone(f,i===3?.34:.1,i*.11,.055));},
  sel:()=>tone(880,.04,0,.03)
};

/* ===== 読み上げ（聴解） =====
   Web Speech API は端末によって日本語の声が無いことがある。
   声が見つかったときだけ聴解の機能を出し、無い端末では黙って隠す。 */
const TTS={ready:false, voice:null};
function pickVoice(){
  try{
    const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    const ja=vs.filter(v=>/^ja(-|_|$)/i.test(v.lang||''));
    if(!ja.length) return false;
    // ローカルの声のほうが遅延がなく、オフラインでも鳴る
    TTS.voice=ja.find(v=>v.localService)||ja[0];
    TTS.ready=true; return true;
  }catch(e){ return false; }
}
function initTTS(){
  if(!('speechSynthesis' in window)) return;
  pickVoice();
  // 声の一覧は非同期で埋まる。あとから届いたら冒険メニューを描き直す
  try{
    speechSynthesis.addEventListener('voiceschanged',()=>{
      const was=TTS.ready;
      if(pickVoice()&&!was&&(route==='field'||route==='conf')) render();
    });
  }catch(e){}
}
let sayTimer=null;
function speak(text,slow,onEnd){
  if(!TTS.ready||!S.speech||!text) { onEnd&&onEnd(); return false; }
  try{
    speechSynthesis.cancel();
    clearTimeout(sayTimer);
    const u=new SpeechSynthesisUtterance(String(text));
    u.voice=TTS.voice; u.lang=(TTS.voice&&TTS.voice.lang)||'ja-JP';
    u.rate=slow?0.7:0.92; u.pitch=1;
    if(onEnd) u.onend=onEnd;
    // cancel 直後の speak は Chrome で無視されることがあるので、少し置いてから鳴らす
    sayTimer=setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ onEnd&&onEnd(); } },70);
    return true;
  }catch(e){ onEnd&&onEnd(); return false; }
}
// 読み上げに渡す文。ルビ記法と出題用の 【】 を外した素の日本語にする
const sayText = s => bare(s).replace(/[【】]/g,'');

/* ===== 文字送り ===== */
let typing=null;
function type(el,text,done,noCursor){
  if(typing) typing.skip();
  el.classList.remove('cursor-wait');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ el.innerHTML=text; if(!noCursor) el.classList.add('cursor-wait'); typing=null; done&&done(); return; }
  // タグを壊さずに送るため、テキストノードだけを順に開いていく。
  // ふりがな(<rt>)まで1文字ずつ出すとちらつくので、ルビは親文字と同時に出す。
  el.innerHTML=text;
  const nodes=[]; const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  const hideEn=document.body.classList.contains('no-en');
  let nd; while((nd=walk.nextNode())){
    if(nd.parentNode && nd.parentNode.nodeName==='RT') continue;
    // 英語を消している間は、見えない文字を送って無言の間を作らない
    if(hideEn && nd.parentElement && nd.parentElement.closest('.gl')) continue;
    // 聴解の説明のような「読ませるより先に見せたい」ものは一度に出す
    if(nd.parentElement && nd.parentElement.closest('.no-type')) continue;
    nodes.push({node:nd,full:nd.nodeValue});
  }
  nodes.forEach(o=>o.node.nodeValue='');
  const rts=[...el.querySelectorAll('rt')];
  rts.forEach(r=>r.style.visibility='hidden');
  let ni=0, ci=0;
  const fin=()=>{
    nodes.forEach(o=>o.node.nodeValue=o.full);
    rts.forEach(r=>r.style.visibility='');
    if(!noCursor) el.classList.add('cursor-wait');
    typing=null; done&&done();
  };
  const t=setInterval(()=>{
    if(ni>=nodes.length){ clearInterval(t); fin(); return; }
    const o=nodes[ni];
    o.node.nodeValue=o.full.slice(0,++ci);
    // 親文字が出たら、そのルビも見せる
    if(o.node.parentNode && o.node.parentNode.nodeName==='RUBY'){
      const r=o.node.parentNode.querySelector('rt'); if(r) r.style.visibility='';
    }
    if(ci>=o.full.length){ ni++; ci=0; }
  },22);
  typing={skip:()=>{clearInterval(t); fin();}};
}
document.addEventListener('click',e=>{ if(typing && !e.target.closest('button')) typing.skip(); });

function drawPx(cv,px,pal,scale){
  const n=px.length, ctx=cv.getContext('2d');
  cv.width=n*scale; cv.height=n*scale;
  cv.style.width=(n*scale)+'px'; cv.style.height=(n*scale)+'px';
  ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,cv.width,cv.height);
  px.forEach((row,y)=>{ for(let x=0;x<row.length;x++){
    const c=pal[row[x]]; if(!c) continue;
    ctx.fillStyle=c; ctx.fillRect(x*scale,y*scale,scale,scale);
  }});
}
const drawMon=(cv,m,scale)=>drawPx(cv,m.px,m.pal,scale);

/* ===== 出題 ===== */
function buildQueue(sec,limit){
  const pool=sec?BY_SEC[sec]:ITEMS;
  const due=pool.filter(i=>isDue(i.id)).sort((a,b)=>rec(a.id).due-rec(b.id).due);
  const fresh=pool.filter(i=>isNew(i.id));
  const q=quota();
  const nNew=sec?Math.ceil(q.fresh/3)+2:q.fresh;
  // 新しい項目は、いまの章のものから先に出す。こうしないと章がいつまでも埋まらない
  const cur=currentChapter();
  const freshOrdered=shuffle(fresh.filter(i=>cur.set.has(i.id))).concat(shuffle(fresh.filter(i=>!cur.set.has(i.id))));
  const out=due.slice(0,limit).concat(freshOrdered.slice(0,Math.max(0,Math.min(nNew,limit-due.length))));
  if(out.length<limit){
    const have=new Set(out.map(i=>i.id));
    const weak=pool.filter(i=>!have.has(i.id)&&rec(i.id).lv<MAX_LV).sort((a,b)=>rec(a.id).lv-rec(b.id).lv);
    out.push(...weak.slice(0,limit-out.length));
  }
  return shuffle(out).slice(0,limit);
}
function distractors(item,field,n){
  const pool=BY_SEC[item.sec].filter(x=>x.id!==item.id&&x[field]&&x[field]!==item[field]);
  const seen=new Set([item[field]]), out=[];
  for(const p of shuffle(pool.slice())){
    if(out.length>=n) break;
    if(seen.has(p[field])) continue;
    seen.add(p[field]); out.push(p);
  }
  return out;
}
// 選択肢の見え方。日本語はふりがな付き、英語と読みはそのまま
const OPT_RUBY={mean:true, w:false, read:false, en:false};
// label は ['にほんご','English'] で渡す。設問文こそ読めないと答えようがない
function q(label,main,item,field){
  const opts=shuffle([{v:item[field],ok:true}].concat(distractors(item,field,3).map(d=>({v:d[field],ok:false}))));
  return {label:label[0],labelEn:label[1],main,item,field,opts,ruby:!!OPT_RUBY[field]};
}
// 見出し語。読みを下に小さく添える（読みを問う設問のときだけ隠す）
function W(word,read,sm,en){
  const cls='qword'+(sm?' sm':'')+(en?' en':'');
  // ローマ字はかなの下にさらに小さく。かなを読む練習の邪魔にならない大きさにする
  const rj=(S.romaji&&read&&!en)?` <span class="rj">${esc(toRomaji(read))}</span>`:'';
  return `<span class="${cls}">${esc(word)}${read?`<span class="qread">${esc(read)}${rj}</span>`:''}</span>`;
}
// 漢字は問い方が語彙と違うので、選択肢を自前で組み立てる
// ordered を立てると候補の順を崩さない。
// 「似た字を先に置いた配列」を渡して、前から3つ取らせるため
function optsOf(correct,cands,ordered){
  const seen=new Set([correct]), out=[];
  for(const v of (ordered?cands.slice():shuffle(cands.slice()))){
    if(out.length>=3) break;
    if(!v||seen.has(v)) continue;
    seen.add(v); out.push(v);
  }
  return shuffle([{v:correct,ok:true}].concat(out.map(v=>({v,ok:false}))));
}
function kanjiQ(item){
  const pool=BY_SEC.kanji.filter(x=>x.id!==item.id);
  const t=['k_mean','k_on','k_word','k_en'];
  if(item.kun) t.push('k_kun');
  if(item.words.length) t.push('k_word');
  const kind=rec(item.id).lv<=1?'k_mean':pick(t);
  if(kind==='k_word'&&item.words.length){
    const j=pick(item.words);
    return {label:'この ことばの よみかたは？',labelEn:'How do you read this word?',main:W(j[0],''),item,
      opts:optsOf(j[1],pool.flatMap(x=>x.words.map(w=>w[1]))),ruby:false};
  }
  if(kind==='k_en') return {label:'この かんじを えいごで いうと？',labelEn:'What does this kanji mean in English?',
    main:W(item.w,''),item,opts:optsOf(item.en,pool.map(x=>x.en)),ruby:false};
  if(kind==='k_on') return {label:'この かんじの おんよみは？',labelEn:'On-reading (from Chinese)?',main:W(item.w,''),item,
    opts:optsOf(item.on,pool.map(x=>x.on)),ruby:false};
  if(kind==='k_kun') return {label:'この かんじの くんよみは？',labelEn:'Kun-reading (Japanese)?',main:W(item.w,''),item,
    opts:optsOf(item.kun,pool.map(x=>x.kun).filter(Boolean)),ruby:false};
  return {label:'この かんじの いみは？',labelEn:'What does this kanji mean?',main:W(item.w,''),item,
    opts:optsOf(item.mean,pool.map(x=>x.mean)),ruby:true};
}
// 聴解の設問。文字を見せずに音だけで出し、答えの選択肢は読める形にする
function earHtml(){
  return `<span class="earbox no-type">
    <button class="ear" id="earBtn" data-replay="" aria-label="もういちど きく">🔊</button>
    <span class="earhint">おとを きいて こたえて ください。<br>
      ボタンで もういちど きけます。${gl('Listen and answer. Tap to replay.')}</span>
  </span>`;
}
function listenQ(item){
  if(item.sec==='kana') return kanaQ(item,'n_listen');
  if(item.sec==='kanji'){
    const pool=BY_SEC.kanji.filter(x=>x.id!==item.id);
    const j=pick(item.words);
    return {label:'きこえた ことばは？',labelEn:'Which word did you hear?',main:earHtml(),item,
      say:j[1],opts:optsOf(j[0],pool.flatMap(x=>x.words.map(w=>w[0]))),ruby:false};
  }
  if(item.sec==='grammar'){
    return {label:'この ぶんで つかって いる かたちは？',labelEn:'Which pattern is used in the sentence?',
      main:earHtml(),item,say:sayText(item.ex),
      opts:optsOf(item.w,distractors(item,'w',8).map(d=>d.w)),ruby:false};
  }
  // ことばは「語だけ聞く」と「文の中で聞く」を交互に出す
  if(item.ex&&Math.random()<0.5){
    return {label:'この ぶんに でて きた ことばは？',labelEn:'Which word did you hear in the sentence?',
      main:earHtml(),item,say:sayText(item.ex),
      opts:optsOf(item.read,distractors(item,'read',8).map(d=>d.read)),ruby:false};
  }
  return {label:'きこえた ことばの いみは？',labelEn:'What does the word you heard mean?',
    main:earHtml(),item,say:item.read,
    opts:optsOf(item.mean,distractors(item,'mean',8).map(d=>d.mean)),ruby:true};
}
// 誤答は、まず見た目が紛らわしい字から取る。
// ランダムに70字から引くと、さ/ち や シ/ツ が並ぶ確率は4%しかなく、
// 初学者がいちばん間違える「見分け」を一度も練習しないまま進んでしまう。
//
// ただし全部を紛らわしい字にはしない。覚える前から は/ほ/ま/け を並べても
// 当て推量になるだけで、間違った紐づけを覚えかねない。
// 出したての字は1つだけ混ぜ、慣れてきたら増やして見分けさせる。
function kanaNear(item,pool){
  const near=shuffle((CONFUSE[item.w]||[])
    .map(c=>pool.find(x=>x.w===c))
    .filter(Boolean));
  const lv=rec(item.id).lv;
  const take=lv<=1?1:(lv<=3?2:3);
  const rest=shuffle(pool.filter(x=>near.indexOf(x)<0));
  return near.slice(0,take).concat(shuffle(near.slice(take).concat(rest)));
}
// かなの出題。選択肢は同じ字種（ひらがな同士・カタカナ同士）でそろえる
function kanaQ(item,force){
  const pool=BY_SEC.kana.filter(x=>x.id!==item.id && x.kata===item.kata);
  const t=['n_read','n_write','n_word'];
  if(TTS.ready) t.push('n_listen');
  // 聴解の洞窟からは音の問題を名指しで頼まれる。声が無い端末だけ通常の出題に落とす
  const kind=(force&&(force!=='n_listen'||TTS.ready))?force
            :(rec(item.id).lv<=1?'n_read':pick(t));
  if(kind==='n_write') return {label:'この おとの かなは？',labelEn:'Which kana makes this sound?',
    main:W(item.romaji,'',false,true),item,opts:optsOf(item.w,kanaNear(item,pool).map(x=>x.w),true),ruby:false};
  if(kind==='n_word') return {label:'この ことばの よみかたは？',labelEn:'How do you read this word?',
    main:W(item.ex,''),item,opts:optsOf(item.exr,pool.map(x=>x.exr)),ruby:false};
  if(kind==='n_listen') return {label:'きこえた ことばは？',labelEn:'Which word did you hear?',
    main:earHtml(),item,say:item.ex,opts:optsOf(item.ex,pool.map(x=>x.ex)),ruby:false};
  return {label:'この かなの おとは？',labelEn:'What sound is this kana?',
    main:W(item.w,''),item,opts:optsOf(item.romaji,kanaNear(item,pool).map(x=>x.romaji),true),ruby:false};
}
function makeQ(item,mode){
  // モードの判定を先に置く。かなを先に見てしまうと、聴解モードでも
  // 音の出ない問題が混ざって「おとだけで こたえる」と食い違う
  if(mode==='listen') return listenQ(item);
  if(item.sec==='kana') return kanaQ(item);
  if(item.sec==='kanji') return kanjiQ(item);
  const t=[];
  if(item.sec==='vocab'){
    t.push('v_mean','v_en');
    if(item.ex&&MARK.test(item.ex)) t.push('v_blank');
    if(/[一-鿿]/.test(item.w)) t.push('v_read');
    t.push('v_jp');
  }else{
    t.push('g_mean','g_en');
    if(item.ex&&MARK.test(item.ex)) t.push('g_blank','g_blank');
  }
  // はじめて出す項目は、いちばん素直な形（意味を選ぶ）から入る
  const kind=rec(item.id).lv<=1?t[0]:pick(t);
  const B={
    v_mean:()=>q(['この ことばの いみは？','What does this word mean?'],W(item.w,item.read),item,'mean'),
    v_en :()=>q(['この ことばを えいごで いうと？','How do you say this word in English?'],W(item.w,item.read),item,'en'),
    v_read:()=>q(['この ことばの よみかたは？','How do you read this word?'],W(item.w,''),item,'read'),
    v_blank:()=>q(['□に はいる ことばは？','Which word fits in the blank?'],`<span class="qsent">${blankHtml(item.ex)}</span>`,item,'w'),
    v_jp :()=>q(['この いみの ことばは？','Which Japanese word means this?'],W(item.en,'',false,true),item,'w'),
    g_mean:()=>q(['この かたちの いみは？','What does this pattern mean?'],W(item.w,'',true),item,'mean'),
    g_en :()=>q(['この かたちを えいごで いうと？','How do you say this pattern in English?'],W(item.w,'',true),item,'en'),
    g_blank:()=>q(['□に はいる かたちは？','Which pattern fits in the blank?'],`<span class="qsent">${blankHtml(item.ex)}</span>`,item,'w')
  };
  return B[kind]();
}

function render(){
  rollDay();

function slotSummary(n){

}

function pips(cur,max,color,seg){
  const n=seg||10, on=max>0?Math.ceil(cur/max*n):0;
  let h='';
  for(let i=0;i<n;i++) h+=`<i class="${i<on?'on':''}" style="--c:${color}"></i>`;
  return `<span class="bar">${h}</span>`;
}
// 章の進み具合。20目盛りで、満了だけ金にする
function pbar(rate){
  const n=20, full=rate>=1;
  // 満了でないのに全部点くと「終わった」と誤解する。逆に、少しでも進んでいたら1つは点ける
  const on = rate<=0 ? 0 : full ? n : Math.max(1,Math.min(n-1,Math.round(rate*n)));
  let h='';
  for(let i=0;i<n;i++) h+=`<i class="${i<on?(full?'full':'on'):''}"></i>`;
  return `<span class="pbar">${h}</span>`;
}

/* ===== せんとう ===== */
let B=null;
// ダンジョンに出る敵を選ぶ。ボスはボス戦だけ、'any' はどこにでも出る
function monPool(sec,boss){
  if(boss) return MONSTERS.filter(m=>m.area==='boss');
  const area=sec||pick(['vocab','kanji','grammar']);
  const p=MONSTERS.filter(m=>m.area===area||m.area==='any');
  return p.length?p:MONSTERS.filter(m=>m.area==='any');
}
// いま狙っている敵。倒した相手は隊列に残したまま、印だけ次へ送る
const foe = () => B.foes[B.tgt] || B.foes[B.foes.length-1];
const aliveFoes = () => B.foes.filter(f=>f.hp>0);
function aimNext(){ const i=B.foes.findIndex(f=>f.hp>0); if(i>=0) B.tgt=i; }
// 体が増えるほど1体を小さく描く。3体でも横幅に収まる大きさにしている。
// 12x12から24x24に上げたぶん倍率は半分。画面上の大きさは従来どおり
const foeScale = (n,boss) => boss?6:(n>=3?3:(n===2?4:5));
function makeFoes(sec,boss,mon,monMax){
  if(mon){ const mx=monMax||mon.hp; return [{m:mon,max:mx,hp:mx}]; }
  const pool=monPool(sec,boss);
  // ボスは1体で立ちはだかる。ふつうの探索は1〜3体。2体をいちばん出やすくする
  const n=boss?1:pick([1,1,2,2,2,3]);
  const out=[];
  for(let i=0;i<n;i++){ const m=pick(pool); out.push({m,max:m.hp,hp:m.hp}); }
  return out;
}
// 「AとAとB」では読みにくいので、同じ相手はまとめて数える
function foesName(fs){
  const order=[], cnt={};
  fs.forEach(f=>{ if(!cnt[f.m.name]){ cnt[f.m.name]=0; order.push(f.m.name); } cnt[f.m.name]++; });
  return order.map(n=>cnt[n]>1?`${n} ${cnt[n]}たい`:n).join('と ');
}

// 戦闘の始まりは1か所にまとめる。ふつうの探索・ステージ練習・ステージのぬし、
// どれも「問題の束」と「敵」が違うだけなので、ここに寄せて枝分かれを減らす
function beginBattle(items,opts){
  opts=opts||{};
  const foes=makeFoes(opts.sec,opts.boss,opts.mon,opts.monMax);
  B={items,i:0,ok:0,ng:0,combo:0,maxCombo:0,exp:0,gold:0,wrong:[],
     sec:opts.sec||null,boss:!!opts.boss,mode:opts.mode||null,chap:opts.chap||null,
     foes,tgt:0,killed:0,levelUps:[]};
  route='battle';
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current','false'));
  drawBattle(opts.intro||`${foesName(foes)}が あらわれた！`);
}
function startBattle(sec,n,boss,mode){
  const limit=n||Math.max(5,Math.min(20,quota().total||10));
  const items=buildQueue(sec||null,limit);
  if(!items.length){ alert('いま、いどめる もんだいが ありません。'); return; }
  beginBattle(items,{sec,boss,mode});
}
// ステージの中だけを回す練習
function startChapPractice(id){
  const ch=CHAPTERS.find(c=>c.id===id); if(!ch) return;
  const pool=ch.ids.map(x=>BY_ID[x]).filter(Boolean);
  const due=pool.filter(i=>isDue(i.id)).sort((a,b)=>rec(a.id).due-rec(b.id).due);
  const fresh=shuffle(pool.filter(i=>isNew(i.id)));
  const weak=pool.filter(i=>!isDue(i.id)&&!isNew(i.id)&&rec(i.id).lv<MAX_LV)
                 .sort((a,b)=>rec(a.id).lv-rec(b.id).lv);
  const items=shuffle(due.concat(fresh,weak).slice(0,12));
  if(!items.length){ alert('この ステージは もう かんぺきです。'); return; }
  beginBattle(items,{sec:ch.sec});
}
// ステージの ぬし。20問ぶんの体力を持たせ、倒しきれたらクリア
function startChapBoss(id){
  const ch=CHAPTERS.find(c=>c.id===id); if(!ch) return;
  if(chapStats(ch).rate<CHAP_OPEN) return;
  const pool=ch.ids.map(x=>BY_ID[x]).filter(Boolean);
  if(pool.length<4) return;
  const items=shuffle(pool.slice()).slice(0,20);
  const mon=SPRITES[ch.boss]||MONSTERS[0];
  beginBattle(items,{sec:ch.sec,boss:true,chap:ch.id,mon,monMax:18,
    intro:`ステージ ${chapNo(ch)}の ぬし\n${mon.name}が 立ちふさがった！`});
}

function hpPips(f){

// 隊列ぜんぶを描き直す。狙っている相手の印もここで付け替える
function foesHtml(){

    </div>
    <div class="cmds row" style="margin-top:6px">

    </div>

  <div id="after"></div>`;

function replaySay(slow){
  const Q=B&&B.q; if(!Q||!Q.say) return;
  const b=$('#earBtn'); if(b) b.classList.add('on');

// 剣が届く時刻に合わせて演出を出す。
// 待っている間に次の問題へ進んだら、前の問題の演出は捨てる
function hitAt(fn,q){
  setTimeout(()=>{ if(B && B.q===q) fn(); },HIT_AT);
}
function popDmg(txt,miss){
  const st=$('#stage'); if(!st) return;
  const d=document.createElement('div'); d.className='dmg'+(miss?' miss':''); d.textContent=txt;
  st.appendChild(d); setTimeout(()=>d.remove(),750);
}
// 呪文。ＭＰが足りていれば何度でも唱えられる。
// スキャンだけは同じ問題で二度唱えても意味がないので、押した時点で閉じる
function cast(id,btn){
  const sp=SPELLS.find(x=>x.id===id);
  if(!sp || !B || spellOff(sp)) return;
  S.mp-=sp.mp; SFX.sel();
  if(id==='scan'){
    btn.disabled=true;
    const wrongIdx=B.q.opts.map((o,i)=>o.ok?-1:i).filter(i=>i>=0);
    shuffle(wrongIdx).slice(0,2).forEach(i=>{
      const b=document.querySelector(`#cmds .cmd[data-a="${i}"]`);
      if(b){ b.disabled=true; b.classList.add('gone'); }
    });
  }else if(id==='bolt'){
    // 隊列ぜんぶに効く。1体しかいない相手にも同じダメージが入る
    const hit=aliveFoes();
    hit.forEach(f=>{ f.hp=Math.max(0,f.hp-2); });
    const box=$('#foes'); if(box) box.innerHTML=foesHtml();
    paintMons($('#foes'));
    document.querySelectorAll('#foes .mon').forEach(m=>m.classList.add('hit'));
    popDmg('2'); SFX.hit();
    const st=$('#stage'); if(st){ st.classList.add('flash'); setTimeout(()=>st.classList.remove('flash'),400); }
    aimNext();
  }else if(id==='heal'){
    const before=S.hp;
    S.hp=Math.min(S.maxHp,S.hp+8);
    popDmg('+'+(S.hp-before)); SFX.up();
    $('#heroSp')?.classList.add('atk');
  }
  persist(); paintHud();
  { const sh=$('#stageHp'); if(sh) sh.innerHTML=stageHp(); }
  // ＭＰが減って唱えられなくなった呪文を閉じる
  document.querySelectorAll('[data-spell]').forEach(b=>{
    const x=SPELLS.find(y=>y.id===b.dataset.spell);
    if(x && spellOff(x)) b.disabled=true;
  });
}
function answer(n){
  const Q=B.q, it=Q.item, ok=Q.opts[n].ok;
  const btns=[...document.querySelectorAll('#cmds .cmd')];
  btns.forEach((b,i)=>{ b.disabled=true;
    if(Q.opts[i].ok) b.classList.add('ok'); else if(i===n) b.classList.add('ng'); });
  const r=grade(it.id,ok);
  let gainExp=0, log='';
  if(ok){
    B.ok++; B.combo++; B.maxCombo=Math.max(B.maxCombo,B.combo);
    const crit=B.combo>=3, dmg=crit?2:1;
    const t=foe();
    t.hp=Math.max(0,t.hp-dmg);
    gainExp=12+Math.min(18,(B.combo-1)*3)+(r.lv===MAX_LV?25:0);
    log=(crit?'かいしんの いちげき！\n':'せいかい！\n')+`${t.m.name}に ${dmg*8}の ダメージ！`;
    heroSwing();
    // 敵の反応は剣が届いてから。先に敵が痛がると、順番が逆に見える。
    // 正解かどうかは選択肢の色で即座に返しているので、ここを遅らせても手応えは落ちない
    // 待っている間にイカズチで狙いが移ることがあるので、相手の位置はここで固定する
    const ti=B.tgt;
    hitAt(()=>{
      const cell=document.querySelector(`[data-foe="${ti}"]`);
      if(cell){
        const bar=cell.querySelector('.mon-hp'); if(bar) bar.innerHTML=hpPips(t);
        const mon=cell.querySelector('.mon'); if(mon) mon.classList.add('hit');
      }
      popDmg(String(dmg*8)); SFX.hit();
    },Q);
  }else{
    B.ng++; B.combo=0; B.wrong.push(it.id);
    const dmg=B.boss?4:3;
    S.hp=Math.max(0,S.hp-dmg); gainExp=3;
    log=`ミス！\n${foe().m.name}の こうげき！\n${dmg}の ダメージを うけた！`;
    $('#stage').classList.add('flash'); $('#heroSp')?.classList.add('hurt');
    popDmg(String(dmg),true); SFX.miss();
    setTimeout(()=>{const s=$('#stage'); if(s) s.classList.remove('flash');},400);
  }
  B.exp+=gainExp; S.exp+=gainExp; S.doneToday++; touched=true;
  // かなが仕上がったらローマ字を一度だけ外す。あとは設定で本人が決める
  if(fadeRomaji()) B.romajiOff=1;
  const markHit=markStudied();
  if(markHit) B.markHit=markHit;
  // 今日のノルマに届いたら、その日1回だけ ごほうび。連続が長いほど多い
  const goal=S.dayGoal||0, td=todayKey();
  if(goal>0 && S.doneToday>=goal && S.bonusDay!==td){
    S.bonusDay=td;
    B.bonus=30+S.streak*2;
    S.gold+=B.bonus;
  }
  // 聴解は本試験で別区分なので、成績も分けて数える
  if(B.mode==='listen'){ S.listenN++; if(ok) S.listenOk++; }
  // レベルアップ判定
  while(S.exp>=expToNext(S.lv)){
    S.exp-=expToNext(S.lv); S.lv++;
    S.maxHp+=4; S.maxMp+=1; S.hp=S.maxHp; S.mp=S.maxMp;
    B.levelUps.push(S.lv);
  }
  persist(); paintHud();
  { const sh=$('#stageHp'); if(sh) sh.innerHTML=stageHp(); }
  const fallen=foe(), dead=fallen.hp<=0, wipe=S.hp<=0;
  $('#bmsg').innerHTML='';
  type($('#bmsg'),esc(log)+`\n<span class="q">けいけんち ${gainExp}を てに いれた。</span>`);
  $('#after').innerHTML=`
    <div class="win"><span class="win-t">まなび${gl('Learn')}</span><div class="learn ruby-on">${learnHtml(it)}</div></div>
    <div class="win tight"><div class="cmds">
      <button class="cmd" data-next=""><span class="cur">▶</span><span>${
        wipe?'…':(dead?`${esc(fallen.m.name)}を たおした！`:(B.i+1>=B.items.length?'たたかいを おえる':'つぎの もんだいへ'))
      }</span></button>
    </div></div>`;
  // こたえた後は魔法を閉じる。答えが見えている状態でスキャンを撃っても
  // ＭＰが減るだけで何も起きず、プレイヤーには理由が分からない
  document.querySelectorAll('[data-spell]').forEach(b=>{ b.disabled=true; });
  $('[data-next]').focus({preventScroll:true});  // 勝手にスクロールさせない
  const deadIdx=B.foes.indexOf(fallen);
  if(dead && !wipe) hitAt(()=>{
    const cell=document.querySelector(`[data-foe="${deadIdx}"]`);
    const mon=cell&&cell.querySelector('.mon'); if(mon) mon.classList.add('dead');
    SFX.down();
  },Q);
  if(wipe) SFX.miss();
}

function nextStep(){
  if(S.hp<=0){ persist(); return vWipe(); }
  // 倒した相手の精算。1問で複数体は倒せないが、まとめて見ておけば取りこぼさない
  let got=0;
  B.foes.forEach(f=>{
    if(f.hp>0||f.paid) return;
    f.paid=1; B.killed++;
    // 倒すと少しＭＰが戻る。宿屋まで魔法を温存するだけの戦い方にしない
    S.mp=Math.min(S.maxMp,S.mp+1);
    const g=f.max*7+(B.boss?60:0);
    got+=g; B.gold+=g; S.gold+=g;
    S.defeated[f.m.id]=(S.defeated[f.m.id]||0)+1;
  });
  if(got) persist();
  if(!aliveFoes().length){
    // ステージの ぬしは1体だけ。倒した時点で決着
    if(B.chap||B.i+1>=B.items.length) return vAfter();
    // 隊列を全部たおした。次の一団が現れる
    B.foes=makeFoes(B.sec,B.boss); B.tgt=0;
    B.i++;
    return drawBattle(`${got}ゴールドを てに いれた！\n${foesName(B.foes)}が あらわれた！`);
  }
  // まだ残っている相手がいる。狙いを次へ送る
  aimNext();
  B.i++;
  if(B.i>=B.items.length) return vAfter();
  drawBattle('');
}

/* ===== 50音表 =====
   ひらがなの並びを持っておき、カタカナはコードをずらして作る。
   や行・わ行の欠けは空マスとして残す（そこが空いているのも表の情報） */
const GOJUON=[
  ['あ','い','う','え','お'],
  ['か','き','く','け','こ'],
  ['さ','し','す','せ','そ'],
  ['た','ち','つ','て','と'],
  ['な','に','ぬ','ね','の'],
  ['は','ひ','ふ','へ','ほ'],
  ['ま','み','む','め','も'],
  ['や','' ,'ゆ','' ,'よ'],
  ['ら','り','る','れ','ろ'],
  ['わ','' ,'' ,'' ,'を'],
  ['ん','' ,'' ,'' ,''  ]
];
const DAKUON=[
  ['が','ぎ','ぐ','げ','ご'],
  ['ざ','じ','ず','ぜ','ぞ'],
  ['だ','ぢ','づ','で','ど'],
  ['ば','び','ぶ','べ','ぼ'],
  ['ぱ','ぴ','ぷ','ぺ','ぽ']
];
const toKata = c => c?String.fromCharCode(c.charCodeAt(0)+0x60):'';
function kanaCell(ch){
  if(!ch) return '<span class="kc gap"></span>';
  const it=BY_ID['n:'+ch];
  // ヲ・ヂ・ヅ は現代のカタカナ表記で使わないので収録していない。表には薄く残す
  if(!it) return `<span class="kc none"><b>${esc(ch)}</b></span>`;
  const r=rec(it.id);
  return `<span class="kc s${r.lv}" title="${esc(it.romaji)}"><b>${esc(ch)}</b><i>${esc(it.romaji)}</i></span>`;
}
function kanaChart(kata){
  const conv=rows=>rows.map(r=>r.map(c=>kata?toKata(c):c));
  const draw=rows=>`<div class="kchart">${rows.map(r=>r.map(kanaCell).join('')).join('')}</div>`;
  return draw(conv(GOJUON))+
    `<div class="ktitle">だくおん・はんだくおん${gl('Voiced sounds')}</div>`+
    draw(conv(DAKUON));
}

  <div class="tabs">${['kana','vocab','kanji','grammar'].map(k=>
    `<button data-bs="${k}" aria-pressed="${k===bookSec}">${SEC_SHORT[k]} ${BY_SEC[k].length}</button>`).join('')}</div>
  <div class="win"><span class="win-t">おぼえた ぐあい${gl('Progress')}</span>
    <div class="note">${s.done} / ${s.n} こ おぼえました（★4いじょう）</div>
    ${bookSec==='kana'
      ? `<div class="ktitle" style="margin-top:4px">ひらがな${gl('Hiragana')}</div>${kanaChart(false)}
         <div class="ktitle">カタカナ${gl('Katakana')}</div>${kanaChart(true)}`
      : `<div class="grid">${tiles.map(i=>`<span class="tile s${rec(i.id).lv}" title="${esc(i.w)}"></span>`).join('')}</div>`}
    <div class="leg">${[[0,'まだ'],[1,'であった'],[2,'★2'],[3,'★3'],[4,'★4'],[5,'★5'],[6,'かんぺき']]
      .map(([n,t])=>`<span><span class="tile s${n}"></span>${t}</span>`).join('')}</div>
  </div>
  <div class="win"><span class="win-t">にがてな もの${gl('Weak points')}</span>
    <div class="entries ruby-on">${listed.slice(0,60).map(i=>{const r=rec(i.id);
      return `<div class="entry"><span class="pip tile s${r.lv}"></span>
        <span><span class="w">${esc(i.w)}</span>${i.read?` <span class="r">${esc(i.read)}${S.romaji&&i.sec!=='kana'?' / '+esc(toRomaji(i.read)):''}</span>`:''}
        <br><span class="m">${rb(i.mean)}</span></span>
        <span class="lv">★${r.lv}${r.seen?`<br>${r.seen}かい`:''}</span></div>`;}).join('')}</div>
    <div class="note" style="margin-top:8px">おぼえが あさい ものから 60こ。まだの ものは うしろ。</div>
  </div>
  <div class="win"><span class="win-t">モンスターずかん${gl('Monsters')}</span>
    <div class="zroster">${MONSTERS.map(m=>{
      const c=S.defeated[m.id]||0;
      return `<div class="zcard ${c?'seen':''}">${monHtml(m,3)}
        <span class="zn">${c?esc(m.name):'？？？'}</span>
        <span class="zc">${c?'たおした '+c:'まだ'}</span>
        ${c?`<span class="zd">${esc(m.msg)}</span>`:''}</div>`;}).join('')}</div>
  </div>`;
}

/* ===== 強さ ===== */
// N5の配点は N2 と区分が違う。
//   ①げんごちしき（もじ・ごい・ぶんぽう）・どっかい … 120点 / きじゅんてん 38点
//   ②ちょうかい                                   …  60点 / きじゅんてん 19点
//   ごうけい 180点、ごうかくは 80点
// このアプリが直接きたえるのは ① のうちの「もじ・ごい・ぶんぽう」だけなので、
// メーターも そのつもりで読めるように書く。
const N5_EXAM={pass:80, total:180, s1:{name:'げんごちしき・どっかい', max:120, base:38}, s2:{name:'ちょうかい', max:60, base:19}};
function vStatus(){
  const d=daysLeft(), st=stats();
  // 収録項目の定着率を、①の目安点に置きかえて見せる（あくまで目安）
  // かなは N5 の出題範囲ではないので、点数の見積もりからは外す
  const jl=stats(JLPT_SECS);
  const est=Math.round(jl.rate*N5_EXAM.s1.max);
  // 聴解は20問こなすまでは数字を出さない。少ない回数の正答率は当てにならない
  const est2=S.listenN>=20?Math.round(S.listenOk/S.listenN*N5_EXAM.s2.max):null;
  $('#view').innerHTML=`
  <div class="win"><span class="win-t">${S.name?esc(S.name)+'の つよさ':'つよさ'}${gl('Status')}</span>
    <div class="st">
      <span class="st-l">レベル</span><span class="st-row"><span class="st-n">${S.lv}</span></span>
      <span class="st-l">ＨＰ</span><span class="st-row"><span class="st-n">${S.hp} / ${S.maxHp}</span></span>
      <span class="st-l">ＭＰ</span><span class="st-row"><span class="st-n">${S.mp} / ${S.maxMp}</span></span>
      <span class="st-l">けいけんち</span><span class="st-row"><span class="st-n">${S.exp}</span><span class="st-l">つぎまで ${expToNext(S.lv)-S.exp}</span></span>
      <span class="st-l">ゴールド</span><span class="st-row"><span class="st-n">${S.gold}</span></span>
      <span class="st-l">れんぞく</span><span class="st-row"><span class="st-n">${S.streak} にち</span>${S.charm?`<span class="st-l">まもりのふだ ${S.charm}</span>`:''}</span>
      <span class="st-l">ステージ</span><span class="st-row"><span class="st-n">${chapClearedCount()} / ${CHAPTERS.length}</span><span class="st-l">クリア</span></span>
      <span class="st-l">たおした かず</span><span class="st-row"><span class="st-n">${Object.values(S.defeated).reduce((a,b)=>a+b,0)}</span></span>
    </div>
  </div>
  <div class="win"><span class="win-t">れんぞくの しるし${gl('Streak badges')}</span>
    <div class="note">まいにち つづけると しるしが つきます。${MARKS.filter(n=>S.marks[n]).length} / ${MARKS.length}</div>
    <div class="marks">${MARKS.map(n=>`<span class="mk ${S.marks[n]?'on':''}">${n}にち</span>`).join('')}</div>
  </div>
  <div class="win"><span class="win-t">ぶんやべつの おぼえた ぐあい${gl('Progress by area')}</span>
    <div class="meters">${['kana','vocab','kanji','grammar'].map(sec=>{
      const s=stats(sec), p=(s.rate*100);
      return `<div class="meter"><span class="lab">${SEC_SHORT[sec]}</span>
        ${pips(p,100,'var(--exp)',14)}<span class="v">${p.toFixed(0)}％</span></div>`;}).join('')}
      <div class="meter"><span class="lab">ぜんたい</span>${pips(st.rate*100,100,'var(--gold)',14)}
        <span class="v">${(st.rate*100).toFixed(0)}％</span></div>
    </div>
  </div>
  <div class="win"><span class="win-t">Ｎ５の てんすう（めやす）${gl('Estimated JLPT N5 score')}</span>
    <div class="meters">
      <div class="meter"><span class="lab">①ちしき</span>${pips(est,N5_EXAM.s1.max,est>=N5_EXAM.s1.base?'var(--exp)':'var(--hp)',14)}
        <span class="v">${est} / ${N5_EXAM.s1.max}</span></div>
      <div class="meter"><span class="lab">②ちょうかい</span>${
        est2==null?pips(0,N5_EXAM.s2.max,'var(--dim)',14)
                  :pips(est2,N5_EXAM.s2.max,est2>=N5_EXAM.s2.base?'var(--exp)':'var(--hp)',14)}
        <span class="v">${est2==null?'—':est2} / ${N5_EXAM.s2.max}</span></div>
    </div>
    <div class="note" style="margin-top:9px">
      ①「げんごちしき（もじ・ごい・ぶんぽう）・どっかい」は 120てんまんてん、きじゅんてんは 38てん。<br>
      ②「ちょうかい」は 60てんまんてん、きじゅんてんは 19てん。<br>
      ごうけい 180てんで、80てん いじょう とれば ごうかくです。<br>
      ①の めやすは、ことば・かんじ・ぶんぽうの ${jl.n}この おぼえた ぐあいから けいさんした ものです（かなは Ｎ５の しけんに 出ないので ふくみません）。
      ②の めやすは「ちょうかいの どうくつ」の せいかいりつ（${S.listenN}もん）から けいさんします。
      ${est>=N5_EXAM.s1.base?'いまの ペースなら ①の きじゅんてんは こえて います。':'まず ①の きじゅんてん 38てんを めざしましょう。'}
    </div>
  </div>
  <div class="win"><span class="win-t">しけんまで${gl('Days to the exam')}</span>
    <div class="msg" style="min-height:0">${d==null?'しけんの ひが きまって いません。':
      d<0?'しけんの ひを すぎて います。せっていで なおして ください。':
      `のこり ${d}にち。\nきょうの ノルマを こなせば、しけんの 2しゅうかん まえに ぜんぶ 1かい まわれます。`}</div>
  </div>
  <div class="win tight"><div class="note">
    ${TTS.ready?'「ちょうかいの どうくつ」で、おとだけの もんだいが れんしゅう できます。ただし ほんばんの ちょうかいは もっと ながい かいわを ききます。'
               :'この きかいには にほんごの こえが ないので、ちょうかいの れんしゅうは できません。'}
  </div></div>`;
}

/* ===== 設定 ===== */

    <div class="fld"><label for="f-date">しけんを うける ひ　<span class="gl" style="display:inline">Exam date</span></label>

/* ===== 入力 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-go2],[data-slot],[data-newgo],[data-hero],[data-dun],[data-boss],[data-listen],[data-inn],[data-a],[data-next],[data-run],[data-retry],[data-bs],[data-ask],[data-spell],[data-tg],[data-reset],[data-replay],[data-sayt],[data-uien],[data-kanaq],[data-nohome],[data-chap],[data-chapboss],[data-buy],[data-wear]');
  if(!t||t.disabled) return;
  const d=t.dataset;
  if(d.hero){
    if(S.hero!==d.hero){
      S.hero=d.hero; SFX.sel();
      if(route==='newgame'){
        // 登録前なので保存しない。入力中のなまえは持ち越す
        S.name=($('#f-name')?.value||'').trim();
        vNewGame(); paintMons();
      }else{ persist(); vConf(); }
    }
    return;
  }
  if(t.hasAttribute('data-uien')){
    // なまえを入れている途中で切り替えられる。再描画で消さないよう持ち越す
    if(route==='newgame') S.name=($('#f-name')?.value||'').trim();
    setUiEnPref(d.uien==='1'); SFX.sel(); return render();
  }
  if(t.hasAttribute('data-nohome')){ lsSet(HOME_KEY,'1'); SFX.sel(); return render(); }
  if(t.hasAttribute('data-kanaq')){
    S.knowsKana=(d.kanaq==='1'); SFX.sel();
    S.name=($('#f-name')?.value||'').trim();   // 入力中のなまえを持ち越す
    vNewGame(); paintMons();
    return;
  }
  if(d.slot){
    const n=Number(d.slot); SFX.sel();
    if(slotUsed(n)){ useSlot(n); return go('field'); }
    // 空の書 → 登録画面へ。この時点では保存しない（やめたら何も残らない）
    SLOT=n; S=normalize(null);
    lsSet(LAST,String(n));
    route='newgame'; return render();
  }
  if(t.hasAttribute('data-newgo')){
    const v=($('#f-name')?.value||'').trim();
    if(!v){ alert('なまえを いれて ください。'); $('#f-name')?.focus(); return; }
    if(S.knowsKana===null){ alert('ひらがなが よめるか、えらんで ください。\nPlease answer the hiragana question.'); return; }
    S.name=v;
    if(S.knowsKana){
      // かなが読めるなら、ステージだけでなく項目じたいを「おぼえた」ことにする。
      // ここを飛ばすと、139字が未学習のまま残って今日の目標や図鑑の数字が狂う。
      // ★5なので、あとで忘れていても復習にちゃんと戻ってくる
      CHAPTERS.filter(c=>c.sec==='kana').forEach(c=>{
        S.chap[c.id]={cleared:1,best:0,skip:1};
        c.ids.forEach(id=>{ S.srs[id]={lv:5,due:Date.now()+INTERVALS[5]*DAY,seen:1,miss:0}; });
      });
    }else{
      // かなが読めない人は、選択肢のかなも読めない。ローマ字を最初から出す
      S.romaji=true;
    }
    persist(); SFX.up(); return go('field');
  }
  if(d.go!==undefined&&t.hasAttribute('data-go')) return go(d.go);
  if(t.hasAttribute('data-go2')) return go(d.go2);
  if(t.hasAttribute('data-dun')){ SFX.sel(); return startBattle(d.dun||null); }
  if(t.hasAttribute('data-boss')){ SFX.sel(); return startBattle(null,30,true); }
  if(t.hasAttribute('data-listen')){ SFX.sel(); return startBattle(null,10,false,'listen'); }
  if(d.chap){ SFX.sel(); return startChapPractice(d.chap); }
  if(d.chapboss){ SFX.sel(); return startChapBoss(d.chapboss); }
  if(d.buy){ return buy(d.buy); }
  if(t.hasAttribute('data-wear')){ S.robe=d.wear||''; persist(); SFX.sel(); return render(); }
  // 2回目からは ゆっくり 読み上げる。聞き取れなかった人に速さを合わせる
  if(t.hasAttribute('data-replay')){ return replaySay(true); }
  if(d.sayt){ return speak(d.sayt,t.hasAttribute('data-slow')); }
  if(t.hasAttribute('data-inn')){
    S.hp=S.maxHp; S.mp=S.maxMp; persist(); SFX.up(); return go('field');
  }
  if(t.hasAttribute('data-a')) return answer(+d.a);
  if(t.hasAttribute('data-next')) return nextStep();
  if(t.hasAttribute('data-run')){ SFX.sel(); return B&&B.i>0?vAfter():go('field'); }
  if(t.hasAttribute('data-retry')){
    const items=B.wrong.map(i=>BY_ID[i]).filter(Boolean);
    if(!items.length) return go('field');
    return beginBattle(items,{sec:B.sec,mode:B.mode,
      mon:pick(MONSTERS.filter(m=>m.area==='any')),intro:'にげた ものたちが たちふさがった！'});
  }
  if(d.bs){ bookSec=d.bs; SFX.sel(); return vBook(); }
  if(d.ask) return askAI(d.ask);
  if(d.spell) return cast(d.spell,t);
  // 画面全体の見た目が変わる設定（uiEn）もあるので、vConf() ではなく render() を通す
  if(d.tg){
    S[d.tg]=!S[d.tg];
    if(d.tg==='uiEn') lsSet(UIEN_KEY,S.uiEn?'1':'0');   // 端末の言語えらびと食い違わせない
    persist(); SFX.sel(); return render();
  }
  if(t.hasAttribute('data-reset')){
    if(confirm(`ぼうけんのしょ ${SLOT}${S.name?'（'+S.name+'）':''} を けします。よろしいですか？`)){
      try{ localStorage.removeItem(KEY(SLOT)); }catch(e){}
      if(db) db.doc('progress/slot'+SLOT).delete().catch(()=>{});
      S=normalize(null); go('title');
    }
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-date'){ S.examDate=e.target.value; persist(); paintHud(); }
  if(e.target.id==='f-new'){ S.newPerDay=Math.max(3,Math.min(40,+e.target.value||12)); persist(); }
  if(e.target.id==='f-rename'){ S.name=e.target.value.trim().slice(0,8); persist(); }
});
document.addEventListener('keydown',e=>{
  if(route!=='battle') return;
  const n=+e.key;
  if(n>=1&&n<=4){ const b=document.querySelector(`#cmds .cmd[data-a="${n-1}"]`); if(b&&!b.disabled) b.click(); }
  if(e.key==='Enter'){ const b=$('[data-next]'); if(b) b.click(); }
});

/* ===== 起動 ===== */
initTTS();
render();
const CL=(typeof window!=='undefined'&&window.claude&&window.claude.use)
  ? window.claude.use.bind(window.claude) : ()=>Promise.resolve(null);
CL('db').then(async d=>{
  if(!d) return; db=d;
  try{
    // 別の端末で進めた書を拾えるよう、3つぶんまとめて取りに行く
    const snaps=await Promise.all(SLOTS.map(n=>d.doc('progress/slot'+n).get().catch(()=>null)));
    snaps.forEach((snap,i)=>{
      const n=SLOTS[i], rem=(snap&&snap.exists)?snap.data():null;
      if(!rem) return;
      const loc=readSlot(n);
      if((rem.updatedAt||0)>((loc&&loc.updatedAt)||0)) writeSlot(n,rem);
    });
    // 開いている書が古ければ差し替える（戦闘中の解答は上書きしない）
    const cur=readSlot(SLOT);
    if(cur&&!touched&&(cur.updatedAt||0)>(S.updatedAt||0)) S=normalize(cur);
    else if(route!=='title'&&route!=='newgame') persist();
  }catch(e){}
  if(route==='battle'||route==='after') paintHud(); else render();
}).catch(()=>{});
CL('sample').then(s=>{ if(s) sample=s; }).catch(()=>{});
})();
</script>
